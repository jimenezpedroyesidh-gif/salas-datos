<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de la sala de cómputo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 1.5rem; margin: 0; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; color: #9cf; margin: 1.6rem 0 .4rem; }
  #resumen { display: flex; flex-wrap: wrap; gap: .8rem; }
  .dato { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: .6rem 1rem; min-width: 120px; }
  .dato b { display: block; font-size: 1.6rem; }
  .dato span { color: #888; font-size: .8rem; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #333; white-space: nowrap; }
  td.prog { white-space: normal; }
  th { color: #9cf; font-weight: 600; }
  .ok { color: #7d7; }
  .mal { color: #f88; }
  #info { color: #888; font-size: .85rem; margin-top: 1.2rem; }
</style>
</head>
<body>
  <h1>Estado de los equipos</h1>
  <div id="resumen"></div>
  <div id="grupos"></div>
  <p id="info">Se actualiza cada 5 minutos. Un equipo sin reporte en las últimas 24 horas se considera apagado o sin internet. Los equipos se agrupan por lo que va antes del primer "-" en su nombre (SA401-PC01-2150 → salón SA401, PC01, inventario 2150).</p>

<script>
const USUARIO = "jimenezpedroyesidh-gif";
const REPO = "salas-datos";
const HORAS_LIMITE = 24;
const ESPERADOS = [];   // opcional: ["SA401-PC01-2150", "SA401-PC02-2151"] para ver también los que nunca reportaron

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grupoDe = h => { const p = h.split(/[-_]/); return p.length > 1 ? p[0] : (h.replace(/\d+$/, "") || "SIN GRUPO"); };
const horasDesde = t => t ? (Date.now() - new Date(t.replace(" ", "T"))) / 3600000 : Infinity;
const partes = h => { const [, pc, inv] = h.split("-"); return { pc: pc || h, inv: inv || "—" }; };
const nombreConexion = c => c === "wifi" ? "Wi-Fi" : c === "ethernet" ? "Ethernet" : "—";

async function cargarEstado() {
  const resumen = document.getElementById("resumen");
  const grupos = document.getElementById("grupos");
  try {
    const r = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/status`);
    if (!r.ok) throw new Error("No se pudo listar la carpeta status");
    const archivos = (await r.json()).filter(f => f.name.endsWith(".json"));
    const datos = await Promise.all(archivos.map(f => fetch(f.download_url).then(x => x.json()).catch(() => null)));

    const mapa = {};
    datos.filter(Boolean).forEach(d => { mapa[d.hostname.toUpperCase()] = d; });
    ESPERADOS.forEach(h => { h = h.toUpperCase(); if (!mapa[h]) mapa[h] = { hostname: h }; });

    const equipos = Object.values(mapa).map(d => ({ ...d, nombre: d.hostname.toUpperCase(), ok: horasDesde(d.ultima_vez) <= HORAS_LIMITE }));
    const porGrupo = {};
    equipos.forEach(e => { const g = grupoDe(e.nombre); (porGrupo[g] = porGrupo[g] || []).push(e); });

    const enLinea = equipos.filter(e => e.ok);
    const tarjetas = [
      ["Equipos", equipos.length], ["Encendidos con internet", enLinea.length],
      ["Sin reporte", equipos.length - enLinea.length],
      ["Por Wi-Fi", enLinea.filter(e => e.conexion === "wifi").length],
      ["Por Ethernet", enLinea.filter(e => e.conexion === "ethernet").length]
    ];
    resumen.innerHTML = tarjetas.map(([t, n]) => `<div class="dato"><b>${n}</b><span>${t}</span></div>`).join("");

    grupos.innerHTML = Object.keys(porGrupo).sort().map(g => {
      const lista = porGrupo[g].sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true }));
      const ok = lista.filter(e => e.ok).length;
      const filas = lista.map(e => `<tr>
        <td>${esc(partes(e.nombre).pc)}</td>
        <td>${esc(partes(e.nombre).inv)}</td>
        <td class="${e.ok ? "ok" : "mal"}">${e.ok ? "✔ Con internet" : "✖ Sin reporte"}</td>
        <td>${e.ok ? nombreConexion(e.conexion) : "—"}</td>
        <td>${esc(e.ultima_vez || "—")}</td>
        <td>${esc(e.arranque || "—")}</td>
        <td class="prog">${esc([].concat(e.procesos || []).join(", ") || "—")}</td></tr>`).join("");
      return `<h2>Salón ${esc(g)} — ${ok} de ${lista.length} con internet</h2>
        <div class="tabla"><table><thead><tr><th>PC</th><th>Inventario</th><th>Estado</th><th>Conexión</th><th>Último reporte</th><th>Encendido desde</th><th>Programas</th></tr></thead><tbody>${filas}</tbody></table></div>`;
    }).join("");
  } catch (err) {
    grupos.innerHTML = `<p class="mal">Error cargando datos: ${esc(err.message)}. Revisa USUARIO y REPO y que el repo de datos sea público.</p>`;
  }
}

cargarEstado();
setInterval(cargarEstado, 300000);
</script>
</body>
</html>
