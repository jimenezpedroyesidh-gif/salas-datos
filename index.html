<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<title>Estado de la sala de cómputo</title>
<style>
  :root {
    --bg: #0e1218; --panel: #161c25; --line: #263041;
    --text: #e8edf3; --muted: #8b98a9; --accent: #8ec5ff;
    --ok: #6fdc8c; --mal: #ff8a8a; --warn: #f2c14e;
    --pad: clamp(.8rem, 4vw, 1.5rem);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
             max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
    max-width: 1100px; margin-inline: auto;
  }
  h1 {
    margin: .4rem 0 1.4rem; text-align: center; text-transform: uppercase;
    font-size: clamp(1.15rem, 5.4vw, 1.75rem); font-weight: 800; letter-spacing: .09em; line-height: 1.2;
    text-wrap: balance;
  }
  h1::after {
    content: ""; display: block; width: 3.2rem; height: 3px; margin: .7rem auto 0;
    border-radius: 2px; background: linear-gradient(90deg, var(--ok), var(--accent));
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Resumen: 3 + 2 tarjetas en móvil, 5 en una fila en pantallas grandes */
  #resumen { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .dato { grid-column: span 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; min-width: 0; }
  .dato:nth-child(n+4) { grid-column: span 3; }
  .dato b { display: block; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dato span { display: block; color: var(--muted); font-size: .75rem; margin-top: .15rem; }
  .dato.ok b { color: var(--ok); }
  .dato.mal b { color: var(--mal); }

  /* Barra de acciones */
  #botones { margin-top: .8rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  #botones button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .9rem; min-height: 44px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  #botones button:active { background: var(--line); }
  #actualizado { margin-left: auto; color: var(--muted); font-size: .78rem; }

  /* Salones */
  .salon { margin-top: .6rem; }
  .salon summary {
    list-style: none; cursor: pointer; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: .75rem 2.4rem .75rem .9rem; min-height: 56px; position: relative;
    display: grid; grid-template-columns: 1fr auto; gap: .45rem .8rem; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .salon summary::-webkit-details-marker { display: none; }
  .salon summary::after {
    content: ""; position: absolute; right: .95rem; top: 1.2rem; width: .5rem; height: .5rem;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg);
  }
  .salon[open] summary::after { transform: rotate(-135deg); top: 1.45rem; }
  .salon[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .s-nombre { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .s-cuenta { font-size: .9rem; font-variant-numeric: tabular-nums; }
  .barra { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--ok); }
  .barra.parcial i { background: var(--warn); }
  .barra.nada i { background: var(--mal); }
  .salon .tabla { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 0 .8rem .3rem; background: var(--bg); }

  .ok { color: var(--ok); }
  .mal { color: var(--mal); }
  .warn { color: var(--warn); }

  /* LED de estado */
  .led { display: inline-block; width: .9rem; height: .9rem; border-radius: 50%; vertical-align: middle; }
  .led.on {
    background: radial-gradient(circle at 35% 30%, #d4ffe0, var(--ok) 55%);
    box-shadow: 0 0 0 2px rgba(111,220,140,.2), 0 0 10px 2px rgba(111,220,140,.6);
  }
  .led.off {
    background: radial-gradient(circle at 35% 30%, #ffdcdc, var(--mal) 55%);
    box-shadow: 0 0 0 2px rgba(255,138,138,.2), 0 0 10px 2px rgba(255,138,138,.5);
  }
  td.c-est { text-align: center; }

  /* Tabla (pantallas grandes) */
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--accent); font-weight: 600; font-size: .9rem; }
  td.prog { white-space: normal; }
  tbody tr:last-child td { border-bottom: 0; }

  /* Móvil: cada PC se convierte en una tarjeta */
  @media (max-width: 640px) {
    .tabla { overflow: visible; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody tr {
      display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem;
      padding: .8rem .1rem; border-bottom: 1px solid var(--line);
    }
    tbody tr:last-child { border-bottom: 0; }
    td { border: 0; padding: .1rem 0; white-space: normal; }
    td.c-pc { grid-area: 1 / 1; font-size: 1.05rem; font-weight: 600; }
    td.c-est { grid-area: 1 / 2; align-self: center; text-align: right; }
    td.c-inv, td.c-con, td.c-ult, td.c-arr, td.prog {
      grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 1rem; font-size: .88rem;
    }
    td[data-l]::before { content: attr(data-l); color: var(--muted); flex-shrink: 0; }
    td.prog { text-align: right; }
    td:empty { display: none; }
  }

  /* Pantallas anchas: resumen en una sola fila */
  @media (min-width: 720px) {
    #resumen { grid-template-columns: repeat(5, 1fr); }
    .dato, .dato:nth-child(n+4) { grid-column: auto; }
    .dato b { font-size: 1.8rem; }
    .dato span { font-size: .82rem; }
  }

  #info { color: var(--muted); font-size: .8rem; line-height: 1.5; margin-top: 1.4rem; max-width: 70ch; }
</style>
</head>
<body>
  <h1>Estado de los equipos</h1>
  <div id="resumen"></div>
  <div id="botones">
    <button id="abrir" type="button">Abrir todos</button>
    <button id="cerrar" type="button">Cerrar todos</button>
    <span id="actualizado"></span>
  </div>
  <div id="grupos"></div>
  <p id="info"></p>

<script>
const USUARIO = "jimenezpedroyesidh-gif";
const REPO = "salas-datos";
const MINUTOS_REPORTE = 5;   // el script de cada equipo se ejecuta cada 5 minutos
const HORAS_LIMITE = 0.75;   // 45 minutos sin reporte = apagado o sin internet
const ESPERADOS = [];   // opcional: ["SA401-PC01-2150", "SA401-PC02-2151"] para ver también los que nunca reportaron

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grupoDe = h => { const p = h.split(/[-_]/); return p.length > 1 ? p[0] : (h.replace(/\d+$/, "") || "SIN GRUPO"); };
const horasDesde = t => t ? (Date.now() - new Date(t.replace(" ", "T"))) / 3600000 : Infinity;
const partes = h => { const [, pc, inv] = h.split("-"); return { pc: pc || h, inv: inv || "—" }; };
const nombreConexion = c => c === "wifi" ? "Wi-Fi" : c === "ethernet" ? "Ethernet" : "—";
document.getElementById("info").textContent =
  `Cada equipo ejecuta el script y reporta cada ${MINUTOS_REPORTE} minutos, y esta página se actualiza sola con la misma frecuencia. ` +
  `Si un equipo pasa más de ${Math.round(HORAS_LIMITE * 60)} minutos sin reportar, se considera apagado o sin internet. ` +
  `Los equipos se agrupan por lo que va antes del primer "-" en su nombre (SA401-PC01-2150 → salón SA401, PC01, inventario 2150).`;
const hace = t => {
  if (!t) return "—";
  const h = horasDesde(t);
  if (isNaN(h)) return String(t);
  const m = Math.round(h * 60);
  if (m < 1) return "ahora";
  if (m < 60) return `hace ${m} min`;
  if (h < 24) return `hace ${Math.floor(h)} h`;
  return `hace ${Math.floor(h / 24)} d`;
};

let abiertos = new Set();
try { abiertos = new Set(JSON.parse(localStorage.getItem("salasAbiertas") || "[]")); } catch (e) {}
const guardarAbiertos = () => { try { localStorage.setItem("salasAbiertas", JSON.stringify([...abiertos])); } catch (e) {} };
document.getElementById("grupos").addEventListener("toggle", e => {
  const d = e.target;
  if (!d.matches || !d.matches("details.salon")) return;
  if (d.open) abiertos.add(d.dataset.g); else abiertos.delete(d.dataset.g);
  guardarAbiertos();
}, true);
document.getElementById("abrir").onclick = () => document.querySelectorAll("details.salon").forEach(d => { d.open = true; });
document.getElementById("cerrar").onclick = () => document.querySelectorAll("details.salon").forEach(d => { d.open = false; });

async function cargarEstado() {
  const resumen = document.getElementById("resumen");
  const grupos = document.getElementById("grupos");
  try {
    const r = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/status`);
    if (!r.ok) throw new Error("No se pudo listar la carpeta status");
    const archivos = (await r.json()).filter(f => f.name.endsWith(".json"));
    const datos = await Promise.all(archivos.map(f => fetch(f.download_url).then(x => x.json()).catch(() => null)));

    const mapa = {};
    datos.filter(Boolean).forEach(d => { mapa[d.hostname.toUpperCase()] = d; });
    ESPERADOS.forEach(h => { h = h.toUpperCase(); if (!mapa[h]) mapa[h] = { hostname: h }; });

    const equipos = Object.values(mapa).map(d => ({ ...d, nombre: d.hostname.toUpperCase(), ok: horasDesde(d.ultima_vez) <= HORAS_LIMITE }));
    const porGrupo = {};
    equipos.forEach(e => { const g = grupoDe(e.nombre); (porGrupo[g] = porGrupo[g] || []).push(e); });

    const enLinea = equipos.filter(e => e.ok);
    const sin = equipos.length - enLinea.length;
    const tarjetas = [
      ["Equipos", equipos.length, ""],
      ["Con internet", enLinea.length, "ok"],
      ["Sin reporte", sin, sin ? "mal" : ""],
      ["Por Wi-Fi", enLinea.filter(e => e.conexion === "wifi").length, ""],
      ["Por Ethernet", enLinea.filter(e => e.conexion === "ethernet").length, ""]
    ];
    resumen.innerHTML = tarjetas.map(([t, n, c]) => `<div class="dato ${c}"><b>${n}</b><span>${t}</span></div>`).join("");

    grupos.innerHTML = Object.keys(porGrupo).sort().map(g => {
      const lista = porGrupo[g].sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true }));
      const ok = lista.filter(e => e.ok).length;
      const pct = Math.round(ok / lista.length * 100);
      const claseBarra = ok === lista.length ? "" : ok === 0 ? "nada" : "parcial";
      const claseCuenta = ok === lista.length ? "ok" : ok === 0 ? "mal" : "warn";
      const filas = lista.map(e => `<tr>
        <td class="c-pc">${esc(partes(e.nombre).pc)}</td>
        <td class="c-inv" data-l="Inventario">${esc(partes(e.nombre).inv)}</td>
        <td class="c-est"><span class="led ${e.ok ? "on" : "off"}" role="img" aria-label="${e.ok ? "Con internet" : "Sin reporte"}" title="${e.ok ? "Con internet" : "Sin reporte"}"></span></td>
        <td class="c-con" data-l="Conexión">${e.ok ? esc(nombreConexion(e.conexion)) : ""}</td>
        <td class="c-ult" data-l="Último reporte" title="${e.ok ? esc(e.ultima_vez || "") : ""}">${e.ok ? esc(hace(e.ultima_vez)) : ""}</td>
        <td class="c-arr" data-l="Encendido desde" title="${e.ok ? esc(e.arranque || "") : ""}">${e.ok ? esc(hace(e.arranque)) : ""}</td>
        <td class="prog" data-l="Programas">${e.ok ? esc([].concat(e.procesos || []).join(", ") || "—") : ""}</td></tr>`).join("");
      return `<details class="salon" data-g="${esc(g)}"${abiertos.has(g) ? " open" : ""}>
        <summary><span class="s-nombre">Salón ${esc(g)}</span><span class="s-cuenta ${claseCuenta}">${ok} de ${lista.length}</span>
          <span class="barra ${claseBarra}"><i style="width:${pct}%"></i></span></summary>
        <div class="tabla"><table><thead><tr><th>PC</th><th>Inventario</th><th>Estado</th><th>Conexión</th><th>Último reporte</th><th>Encendido desde</th><th>Programas</th></tr></thead><tbody>${filas}</tbody></table></div></details>`;
    }).join("");

    document.getElementById("actualizado").textContent = "Actualizado " + new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  } catch (err) {
    grupos.innerHTML = `<p class="mal">Error cargando datos: ${esc(err.message)}. Revisa USUARIO y REPO y que el repo de datos sea público.</p>`;
  }
}

cargarEstado();
setInterval(cargarEstado, 300000);
</script>
</body>
</html>
